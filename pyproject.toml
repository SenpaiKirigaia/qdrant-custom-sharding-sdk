[project]
name = "qdrant-custom-sharding-sdk"
version = "0.1.0"
description = "Custom Sharding Sdk for Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12",
    "boto3>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_custom_sharding"]

[tool.hatch.build.targets.wheel.force-include]
"src/qdrant_custom_sharding/py.typed" = "qdrant_custom_sharding/py.typed"
"src/qdrant_custom_sharding/sharded_client.pyi" = "qdrant_custom_sharding/sharded_client.pyi"
"src/qdrant_custom_sharding/async_sharded_client.pyi" = "qdrant_custom_sharding/async_sharded_client.pyi"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: tests that need a real Qdrant or MinIO",
    "e2e: tests that run the full client path on the local stack",
    "typing: pyright checks that are not part of the default unit run",
]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration and not e2e and not typing'"
