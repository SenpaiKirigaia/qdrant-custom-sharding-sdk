[project]
name = "qdrant-custom-sharding-sdk"
version = "0.1.0"
description = "Drop-in Qdrant client for custom sharding by payload feature"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Senpai Kirigaia" },
]
keywords = ["qdrant", "sharding", "vector-database", "custom-sharding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
s3 = ["boto3>=1.36"]

[project.urls]
Homepage = "https://github.com/SenpaiKirigaia/qdrant-custom-sharding-sdk"
Repository = "https://github.com/SenpaiKirigaia/qdrant-custom-sharding-sdk"
Issues = "https://github.com/SenpaiKirigaia/qdrant-custom-sharding-sdk/issues"

[project.scripts]
qdrant-sharding-dashboard = "qdrant_custom_sharding.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_custom_sharding"]

[tool.hatch.build.targets.wheel.force-include]
"src/qdrant_custom_sharding/py.typed" = "qdrant_custom_sharding/py.typed"
"src/qdrant_custom_sharding/sharded_client.pyi" = "qdrant_custom_sharding/sharded_client.pyi"
"src/qdrant_custom_sharding/async_sharded_client.pyi" = "qdrant_custom_sharding/async_sharded_client.pyi"

[dependency-groups]
dev = [
    "boto3>=1.36",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: tests that need a real Qdrant or MinIO",
    "e2e: tests that run the full client path on the local stack",
    "typing: pyright checks that are not part of the default unit run",
]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration and not e2e and not typing'"
